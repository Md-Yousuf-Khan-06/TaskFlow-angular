<div class="statistics-container">
    <div class=" stat-card stat-card-total">
        <h3> Total Tasks  </h3>
        <p> {{getTotalTasks()}} </p>
    </div>   
    <div class=" stat-card stat-card-completed">
        <h3> Completed Tasks  </h3>
        <p> {{getCompletedTasks()}} </p>
    </div>
    <div class=" stat-card stat-card-pending">
        <h3> Pending Tasks  </h3>
        <p> {{getPendingTasks()}} </p>
    </div>

 </div>

<div class="addtodo-container">
    <input [(ngModel)]= 'task' placeholder="Enter a new task">
    <button (click)="addTask()" class="addbutton"> Add task</button>
</div> 

<div class="task-container">
    @for(taskitem of tasks; track $index){
    <div class="task-card"
    [class.completed-card]="taskitem.completed">
    
    @if (taskitem.edit){
        <input [(ngModel)]="taskitem.name" class="editinput">
        
    }
    @else{
        {{taskitem.name}}
    }
    @if(taskitem.edit){
        <button (click)="saveTask($index)" class="savebutton">Save</button>
        <button (click)="deleteTask($index)" class="deletebutton"> Delete </button>
    }
    @else{
        <div class="task-actions"></div>
        @if(!taskitem.completed){
            <button (click)="completeTask($index)" class="completebutton">Complete</button>
        }
        <button (click)="editTask($index)" class="editbutton"> Edit </button>
        <button (click)="deleteTask($index)" class="deletebutton"> Delete </button>
    }

</div> 
}

</div>
