<div class="statistics-container">
    <div class=" stat-card stat-card-total">
        <h3> Total Tasks  </h3>
        <p> {{getTotalTasks()}} </p>
    </div>   
    <div class=" stat-card stat-card-completed">
        <h3> Completed Tasks  </h3>
        <p> {{getCompletedTasks()}} </p>
    </div>
    <div class=" stat-card stat-card-pending">
        <h3> Pending Tasks  </h3>
        <p> {{getPendingTasks()}} </p>
    </div>

 </div>

<div class="addtodo-container">
    <input [(ngModel)]= 'task' placeholder="Enter a new task">
    <button (click)="addTask()" class="addbutton"> Add task</button>
</div> 

<div class="task-container">
    @for(taskitem of tasks; track $index){
    <div class="task-card"
    [class.completed-card]="taskitem.completed">
        {{taskitem.name}}
    @if(!taskitem.completed){
        <button (click)="completeTask($index)">Complete</button>
        }
    <button (click)="deleteTask($index)" class="deletebutton"> Delete </button>
</div> 
}

</div>
